name: Build SmartGas Android APK

on:
  push:
    branches:
      - smartgas-apk-build-20261031
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check live Firebase current reading
        run: |
          echo "Unauthenticated read:"
          curl -sS -w "\nHTTP_CODE:%{http_code}\n" "https://gaslpg-54c74-default-rtdb.firebaseio.com/gasMonitor/current.json"

      - name: Check anonymous Firebase Authentication
        shell: bash
        run: |
          set -e
          RESP=$(curl -sS -X POST             -H "Content-Type: application/json"             -d '{"returnSecureToken":true}'             "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=AIzaSyA-XkLCV2-NS7zyJwz3IGBuuJg8qCcpv_0")
          export RESP
          python3 - <<'PY'
          import json, os
          data=json.loads(os.environ["RESP"])
          if "idToken" in data:
              print("ANON_AUTH_OK")
          else:
              print("ANON_AUTH_FAILED:", data.get("error",{}).get("message","unknown"))
          PY

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: smartgas_android_apk
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare installer
        run: cp smartgas_android_apk/app/build/outputs/apk/debug/app-debug.apk SmartGasMonitor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SmartGasMonitor-APK
          path: SmartGasMonitor.apk
          if-no-files-found: error
