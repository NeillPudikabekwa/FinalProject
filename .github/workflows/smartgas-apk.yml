name: Discover SmartGas live Firebase path

on:
  push:
    branches:
      - smartgas-apk-build-20261031
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe likely household device paths
        shell: bash
        run: |
          BASE="https://gaslpg-54c74-default-rtdb.firebaseio.com"
          for H in default home my-home household-1 household1 216444620 pudikabekwa smartgas smart-gas smartgas-home tut egd107v main demo; do
            echo "=== $H ==="
            curl -sS -w "\nHTTP:%{http_code}\n" "$BASE/households/$H/devices.json"
          done
