name: Build SmartGas Android APK

on:
  push:
    branches:
      - smartgas-apk-build-20261031
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: smartgas_android_apk
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare installer
        run: cp smartgas_android_apk/app/build/outputs/apk/debug/app-debug.apk SmartGasMonitor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SmartGasMonitor-APK
          path: SmartGasMonitor.apk
          if-no-files-found: error
